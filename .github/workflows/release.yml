name: Release

# Two things ship from this repository and only one of them is published here.
#
#   `agentblog` on npm       Published by changesets, in the `npm` job below.
#   The registry JSON        Served by apps/web at agentblog.dev/r/{name}.json.
#                            Vercel builds and deploys apps/web from its own Git
#                            integration on every push to main. There is no
#                            deploy step in this file because a deploy this
#                            workflow cannot exercise is a deploy nobody can
#                            trust: it would sit here untested until the day it
#                            was needed. The `registry` job below builds the same
#                            output and attaches it to the GitHub Release, which
#                            is what makes tag pinning work for the GitHub
#                            install path (`goldk3y/agentblog/blog#v1.2.0`).
#
# @see https://docs.agentblog.dev/installation

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Publishing needs a credential this repository cannot create for itself, and
  # a fork does not have one at all. Without this gate every push to main ran
  # `changeset publish` against an unauthenticated registry, got `E404 PUT
  # https://registry.npmjs.org/agentblog`, and painted main red for a condition
  # that is not a defect. A red main that is always red is a signal nobody reads.
  #
  # The first version of that gate overcorrected. It skipped the publish and
  # exited 0 unconditionally, so a push to main with released work waiting on it
  # finished green in six seconds having published nothing, and the explanation
  # went to the step summary, which is a page nobody opens when the tick is
  # already green. `agentblog` sat unpublished on npm for a day of commits and
  # the first person to run `npx agentblog@latest init` got `E404 Not Found`.
  # That is this repository's own characteristic failure: it compiled, it linted,
  # it went green, and the product was invisible.
  #
  # So the gate now distinguishes the two states it was collapsing:
  #
  #   Nothing to release      No changeset is pending, so a skipped publish
  #                           costs nothing. Green, quietly.
  #   A release was expected  Changesets are pending and there is no token, so
  #                           work that was marked user-visible cannot reach
  #                           users. Red, with an annotation on the run itself.
  #
  # A fork is exempt from the failing case, because a fork has no token by
  # construction and its red would be the noise the original gate removed.
  #
  # `secrets` is not one of the contexts GitHub exposes to a job-level `if`
  # (`github`, `needs`, `vars`, and `inputs` are), so the decision is made in a
  # job that can read secrets and published as an output, which `needs` then
  # makes available to the `if` below.
  #
  # @see https://docs.github.com/en/actions/reference/workflows-and-actions/contexts
  preflight:
    name: Check that publishing is set up
    runs-on: ubuntu-latest
    outputs:
      can-publish: ${{ steps.check.outputs.can-publish }}
    steps:
      - uses: actions/checkout@v7

      # Counted from the files rather than from `changeset status`, which would
      # need a full pnpm install to answer a question that is one `find` away.
      # `.changeset/README.md` and `config.json` are not changesets.
      - id: pending
        name: Count the changesets waiting on a release
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count changeset(s) pending"

      - id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PENDING: ${{ steps.pending.outputs.count }}
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo 'can-publish=true' >> "$GITHUB_OUTPUT"
            echo '### Publishing is configured' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'can-publish=false' >> "$GITHUB_OUTPUT"
          {
            echo '### Publishing is not set up, so nothing was published'
            echo
            echo "The \`NPM_TOKEN\` secret is not set on this repository, and $PENDING"
            echo 'changeset(s) are waiting on it. Everything else in this workflow'
            echo 'ran; only the publish was skipped. To turn publishing on:'
            echo
            echo '1. Claim `agentblog` and the `@agentblog` scope on npm.'
            echo '2. Create a granular access token with write access to both.'
            echo '3. Add it as the `NPM_TOKEN` repository secret.'
            echo
            echo 'After the first successful publish, replace the token with'
            echo 'trusted publishing (`npm trust github agentblog --file release.yml`),'
            echo 'which needs no long-lived secret at all.'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$IS_FORK" = 'true' ]; then
            echo 'Fork, and a fork has no publishing credential by construction. Not failing.'
            exit 0
          fi

          if [ "$PENDING" -eq 0 ]; then
            echo 'No changeset is pending, so there was nothing to publish anyway.'
            exit 0
          fi

          echo "::error title=Nothing was published::$PENDING changeset(s) are waiting on a release and NPM_TOKEN is not set on this repository. Every version described by those changesets is unreachable to anyone running npx agentblog. See this run's summary for the three steps that fix it."
          exit 1

  npm:
    name: Publish agentblog to npm
    needs: [preflight]
    if: needs.preflight.outputs.can-publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      # `true` only when changesets actually pushed a version to npm. A run that
      # merely opened the version PR succeeds too, so job success does not mean
      # a release happened.
      published: ${{ steps.changesets.outputs.published }}
    permissions:
      contents: write # changesets commits the version bump and tags the release
      pull-requests: write # and opens the "Version Packages" PR
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # changesets needs the full history to work out what changed since the
          # last release.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # `release` builds the CLI before publishing. A published package that was
      # never built is the one release failure with no recovery short of a new
      # version number.
      - name: Create a release PR, or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  registry:
    name: Build and attach the registry
    runs-on: ubuntu-latest
    needs: [npm]
    # Only when changesets actually published. `needs.npm.result == 'success'`
    # was the wrong test: the job succeeds just as cleanly on a run that only
    # opened the "Version Packages" PR, so the artifact was being built and
    # named after a release that had not happened. The action's `published`
    # output is the one thing that distinguishes the two.
    if: needs.npm.outputs.published == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate before building
        working-directory: apps/web
        run: pnpm exec shadcn registry validate

      - name: Build the registry
        run: pnpm --filter @agentblog/web registry:build

      - name: Assert the output is publishable
        run: |
          node scripts/assert-catalog-shape.mjs
          node scripts/assert-schema-valid.mjs

      # Keeping a copy per release means an install pinned to a tag resolves to
      # the exact JSON that shipped with that tag, rather than to whatever
      # agentblog.dev is serving today.
      - uses: actions/upload-artifact@v7
        with:
          name: registry-${{ github.sha }}
          path: apps/web/public/r
          retention-days: 90

      - name: Note where the registry is actually served from
        run: |
          echo 'The published registry is served by apps/web on Vercel:'
          echo '  https://agentblog.dev/r/{name}.json'
          echo
          echo 'Vercel deploys apps/web from its own Git integration on every push to'
          echo 'main. This workflow does not deploy it. It builds the identical output,'
          echo 'validates it, and keeps a copy attached to this run so a tagged GitHub'
          echo 'install resolves to the JSON that shipped with the tag.'
